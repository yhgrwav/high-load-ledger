# postgres-exporter / redis-exporter for the "Инфраструктура" Grafana dashboard. There is no
# nginx-exporter here on purpose: this k8s topology has no nginx (Service + HPA do that job
# instead of a container), so the dashboard's 3 nginx panels stay "No data" permanently — that's
# expected, not a bug. Only monitors the primary `redis` cache instance (not idempotency-redis),
# matching what the docker-compose redis-exporter watched.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: ledger
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres-exporter }
  template:
    metadata:
      labels: { app: postgres-exporter }
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          # env[].value does NOT support $(VAR) interpolation the way command/args do — that's
          # k8s-only syntax valid in command/args, so building DATA_SOURCE_NAME as a plain env
          # value left the literal string "$(DB_SUPER_USER)" in the DSN. Build it in a shell
          # instead, where $VAR expansion is real.
          command: ["sh", "-c"]
          args:
            - export DATA_SOURCE_NAME="postgresql://$DB_SUPER_USER:$DB_SUPER_PASSWORD@postgres:5432/$DB_NAME?sslmode=disable"; exec postgres_exporter
          env:
            - { name: DB_SUPER_USER, valueFrom: { secretKeyRef: { name: ledger-secrets, key: DB_SUPER_USER } } }
            - { name: DB_SUPER_PASSWORD, valueFrom: { secretKeyRef: { name: ledger-secrets, key: DB_SUPER_PASSWORD } } }
            - { name: DB_NAME, valueFrom: { configMapKeyRef: { name: ledger-config, key: DB_NAME } } }
          ports:
            - { name: metrics, containerPort: 9187 }
          resources:
            requests: { cpu: "50m", memory: 32Mi }
            limits: { cpu: "250m", memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: ledger
spec:
  selector: { app: postgres-exporter }
  ports:
    - { port: 9187, targetPort: 9187 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: ledger
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis-exporter }
  template:
    metadata:
      labels: { app: redis-exporter }
    spec:
      enableServiceLinks: false
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.58.0
          env:
            - { name: REDIS_ADDR, value: "redis://redis:6379" }
            - { name: REDIS_PASSWORD, valueFrom: { secretKeyRef: { name: ledger-secrets, key: REDIS_PASSWORD } } }
          ports:
            - { name: metrics, containerPort: 9121 }
          resources:
            requests: { cpu: "50m", memory: 32Mi }
            limits: { cpu: "250m", memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: ledger
spec:
  selector: { app: redis-exporter }
  ports:
    - { port: 9121, targetPort: 9121 }
