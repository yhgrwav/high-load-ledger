# Non-secret tunables. Mirrors the "KUBERNETES" reference block at the bottom of .env —
# keep the two in sync when changing pool sizes or replica counts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-config
  namespace: ledger
data:
  DB_NAME: "ledger"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_SSL_MODE: "disable"
  DB_MAX_CONNS: "60"
  DB_MIN_CONNS: "15"

  PG_MAX_CONNECTIONS: "1200"
  PG_SHARED_BUFFERS: "1GB"
  PG_SYNCHRONOUS_COMMIT: "off"

  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_POOL_SIZE: "800"
  REDIS_MIN_IDLE_CONNS: "80"
  REDIS_POOL_TIMEOUT: "2s"
  REDIS_TRANSACTION_TTL: "67m"

  IDEMPOTENCY_REDIS_HOST: "idempotency-redis"
  IDEMPOTENCY_REDIS_PORT: "6379"
  IDEMPOTENCY_REDIS_DB: "0"
  IDEMPOTENCY_REDIS_POOL_SIZE: "500"
  IDEMPOTENCY_REDIS_MIN_IDLE_CONNS: "50"
  IDEMPOTENCY_REDIS_POOL_TIMEOUT: "3s"

  GRPC_PORT: "50051"
  ENVIRONMENT: "production"
  SERVICE_NAME: "ledger"
  METRICS_PORT: "6767"
  LOG_LEVEL: "warn"
  ADD_SOURCE: "false"
  IS_JSON: "true"
  GOMAXPROCS: "2" # must match gateway.yaml's container cpu limit

  POSTING_WORKER_NAME: "balance_verifier"
  POSTING_WORKER_BATCH_SIZE: "200"
  POSTING_WORKER_BACKOFF: "10s"
  POSTING_WORKER_DB_MAX_CONNS: "100"
  POSTING_WORKER_DB_MIN_CONNS: "20"

  KAFKA_BROKERS: "kafka:29092"
  KAFKA_TOPIC: "completed_transactions"
  KAFKA_CONSUMER_GROUP: "ledger-stats-cache"

  # loadgen — цель 10k RPS, см. .env для развёрнутого обоснования потолка
  LOAD_GEN_WORKING: "true"
  USERS_AMOUNT: "100000"
  VALID_RPS: "10000"
  INVALID_RPS: "100"
  INVALID_CURRENCY_RPS: "100"
  STATS_RPS: "100"
  LOAD_DURATION: "5m"
  LOAD_BOOTSTRAP_WORKERS: "80"
  LOAD_TX_WORKERS: "2300"
  # dns:/// + round_robin (see cmd/loadgen/main.go) needs a headless Service (gateway-headless,
  # k8s/gateway.yaml) to get one DNS A-record per pod. Pointing this at the normal `gateway`
  # ClusterIP Service would resolve to a single VIP and defeat the round-robin entirely.
  # Connections raised past the old 8: with round_robin each connection load-balances across
  # every resolved pod, but more connections still means more concurrent HTTP/2 streams/goroutines
  # feeding the pool — matched to gateway-hpa's maxReplicas so a fully scaled-out HPA isn't
  # starved by too few client connections.
  LOADGEN_GRPC_CONNECTIONS: "32"
  BOOTSTRAP_MAX_ERROR_PCT: "33"
  LOADGEN_GRPC_ADDR: "gateway-headless:50051"
  LOADGEN_METRICS_PORT: "9092"
