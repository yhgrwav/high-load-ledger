# Plaintext placeholders for a local kind cluster only — never commit real credentials here.
# For anything beyond local experimentation, generate this via `kubectl create secret` /
# sealed-secrets / external-secrets instead of checking it into git.
apiVersion: v1
kind: Secret
metadata:
  name: ledger-secrets
  namespace: ledger
type: Opaque
stringData:
  DB_SUPER_USER: "super_user"
  DB_SUPER_PASSWORD: "password"
  DB_USER: "default_user"
  DB_PASSWORD: "password"
  REDIS_PASSWORD: "password"
