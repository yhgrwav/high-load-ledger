# SQL files come from the "ledger-migrations" ConfigMap, generated by kustomization.yaml's
# configMapGenerator from ../migrations/*.sql — do not hand-edit that ConfigMap.
apiVersion: batch/v1
kind: Job
metadata:
  name: ledger-app-migrate
  namespace: ledger
spec:
  backoffLimit: 3
  template:
    spec:
      enableServiceLinks: false
      restartPolicy: Never
      containers:
        - name: migrate
          image: migrate/migrate:v4.19.1
          args:
            - -path=/migrations/
            - -database=postgres://$(DB_SUPER_USER):$(DB_SUPER_PASSWORD)@postgres:5432/$(DB_NAME)?sslmode=disable
            - up
          env:
            - { name: DB_SUPER_USER, valueFrom: { secretKeyRef: { name: ledger-secrets, key: DB_SUPER_USER } } }
            - { name: DB_SUPER_PASSWORD, valueFrom: { secretKeyRef: { name: ledger-secrets, key: DB_SUPER_PASSWORD } } }
            - { name: DB_NAME, valueFrom: { configMapKeyRef: { name: ledger-config, key: DB_NAME } } }
          volumeMounts:
            - { name: migrations, mountPath: /migrations }
      volumes:
        - { name: migrations, configMap: { name: ledger-migrations } }
