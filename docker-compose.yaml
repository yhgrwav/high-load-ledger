services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SUPER_USER: ${DB_SUPER_USER}
      DB_SUPER_PASSWORD: ${DB_SUPER_PASSWORD}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-400}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-50}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-500}
      IDEMPOTENCY_REDIS_HOST: idempotency-redis
      IDEMPOTENCY_REDIS_PORT: "6379"
      IDEMPOTENCY_REDIS_PASSWORD: ${REDIS_PASSWORD}
      IDEMPOTENCY_REDIS_DB: ${IDEMPOTENCY_REDIS_DB:-0}
      METRICS_PORT: ${METRICS_PORT}
      GRPC_PORT: ${GRPC_PORT}
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-completed_transactions}
      GOMAXPROCS: 4
    expose:
      - "50051"
      - "6767"
    networks:
      - ledger_network
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      idempotency-redis:
        condition: service_started
      ledger-app-migrate:
        condition: service_completed_successfully

  posting-worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SSL_MODE: disable
      DB_NAME: ${DB_NAME}
      DB_SUPER_USER: ${DB_SUPER_USER}
      DB_SUPER_PASSWORD: ${DB_SUPER_PASSWORD}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-400}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-50}
      POSTING_WORKER_NAME: ${POSTING_WORKER_NAME}
      POSTING_WORKER_BATCH_SIZE: ${POSTING_WORKER_BATCH_SIZE}
      POSTING_WORKER_BACKOFF: ${POSTING_WORKER_BACKOFF}
      METRICS_PORT: ${METRICS_PORT}
      SERVICE_NAME: ledger-posting-worker
    expose:
      - "6767"
    networks:
      - ledger_network
    depends_on:
      postgres:
        condition: service_healthy
      ledger-app-migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.25-alpine
    container_name: ledger_nginx
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ledger_network
    depends_on:
      - gateway

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.0
    container_name: ledger_nginx_exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://ledger_nginx:8080/stub_status
    ports:
      - "9113:9113"
    networks:
      - ledger_network
    depends_on:
      - nginx

  postgres:
    image: postgres:18-alpine
    container_name: ledger_postgres
    restart: always
    command: ["postgres", "-c", "max_connections=${PG_MAX_CONNECTIONS:-1000}", "-c", "shared_buffers=${PG_SHARED_BUFFERS:-512MB}"]
    environment:
      POSTGRES_USER: ${DB_SUPER_USER}
      POSTGRES_PASSWORD: ${DB_SUPER_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ledger_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 10

  ledger-app-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations
    networks:
      - ledger_network
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - -path=/migrations/
      - -database=postgres://${DB_SUPER_USER}:${DB_SUPER_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      - up

  prometheus:
    image: prom/prometheus:v3.11.3
    container_name: ledger_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "19090:9090"
    networks:
      - ledger_network

  grafana:
    image: grafana/grafana:11.5.2
    container_name: ledger_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_HTTP_PORT: 3000
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: "grafana-lokiexplore-app,grafana-pyroscope-app"
      GF_APP_UPDATE_CHECK: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - ledger_network

  redis:
    image: redis:7-alpine
    container_name: ledger_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - ledger_network

  idempotency-redis:
    image: redis:7-alpine
    container_name: ledger_idempotency_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${IDEMPOTENCY_REDIS_PORT:-6377}:6379"
    networks:
      - ledger_network

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: ledger_redis_exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "9121:9121"
    networks:
      - ledger_network
    depends_on:
      - redis

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: ledger_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_SUPER_USER}:${DB_SUPER_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - ledger_network
    depends_on:
      postgres:
        condition: service_healthy



  kafka:
    image: confluentinc/confluent-local:7.6.0
    container_name: ledger_kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - ledger_network

  kafka-init:
    image: confluentinc/confluent-local:7.6.0
    restart: "no"
    depends_on:
      kafka:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic $${KAFKA_TOPIC:-completed_transactions} --partitions 3 --replication-factor 1
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-completed_transactions}
    networks:
      - ledger_network

  stats-worker:
    build:
      context: .
      dockerfile: docker/stats/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}
      REDIS_TRANSACTION_TTL: ${REDIS_TRANSACTION_TTL}
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-completed_transactions}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-ledger-stats-cache}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - ledger_network
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  loadgen:
    build:
      context: .
      dockerfile: docker/loadgen/Dockerfile
    restart: "no"
    environment:
      LOAD_GEN_WORKING: ${LOAD_GEN_WORKING:-true}
      USERS_AMOUNT: ${USERS_AMOUNT}
      VALID_RPS: ${VALID_RPS}
      INVALID_RPS: ${INVALID_RPS}
      INVALID_CURRENCY_RPS: ${INVALID_CURRENCY_RPS}
      STATS_RPS: ${STATS_RPS}
      LOAD_DURATION: ${LOAD_DURATION}
      LOAD_BOOTSTRAP_WORKERS: ${LOAD_BOOTSTRAP_WORKERS}
      LOAD_TX_WORKERS: ${LOAD_TX_WORKERS:-2000}
      LOADGEN_GRPC_CONNECTIONS: ${LOADGEN_GRPC_CONNECTIONS:-8}
      BOOTSTRAP_MAX_ERROR_PCT: ${BOOTSTRAP_MAX_ERROR_PCT}
      LOADGEN_GRPC_ADDR: nginx:80
      LOADGEN_METRICS_PORT: ${LOADGEN_METRICS_PORT:-9092}
    expose:
      - "9092"
    networks:
      - ledger_network
    depends_on:
      nginx:
        condition: service_started
      gateway:
        condition: service_started
      stats-worker:
        condition: service_started
      ledger-app-migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  grafana_data:

networks:
  ledger_network:
    driver: bridge
