worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream gateway_backend {
        server gateway:50051;
        keepalive 1024;
    }

    server {
        listen 80 http2;

        server_name localhost;

        access_log off; # Disable access log for better performance
        error_log /dev/stderr notice;

        grpc_read_timeout 5s;
        grpc_send_timeout 5s;

        location / {
            grpc_pass grpc://gateway_backend;
            
            # Optimize for high throughput
            grpc_socket_keepalive on;
            grpc_buffer_size 8k;

            error_page 502 = /grpc_errors;
        }

        location = /grpc_errors {
            internal;
            default_type application/grpc;
            add_header grpc-status 14 always;
            add_header grpc-message "Upstream unavailable" always;
            return 200;
        }
    }

    server {
        listen 8080;
        server_name localhost;

        location = /stub_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }
}
